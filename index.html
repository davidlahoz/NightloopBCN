<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>NIGHTLOOP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23f2c078'/></svg>" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #07080a; overflow: hidden;
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
    }
    #canvas {
      width: 100%; height: 100%; display: block; outline: none;
      touch-action: none; cursor: default;
    }
    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(120% 90% at 50% 110%, #10141c 0%, #07080a 60%, #050608 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1.4s ease; opacity: 1; pointer-events: none;
    }
    #loader.hidden { opacity: 0; }
    #loader .mark {
      color: #d8dee9; font-size: 34px; font-weight: 300;
      letter-spacing: 1.05em; text-indent: 1.05em; /* balance tracking */
      text-shadow: 0 0 24px rgba(122, 162, 247, 0.25);
      user-select: none;
    }
    #loader .mark b { font-weight: 600; color: #f2c078; text-shadow: 0 0 28px rgba(242, 192, 120, 0.35); }
    #loader .bar-wrap {
      margin-top: 42px; width: 260px; height: 2px;
      background: rgba(216, 222, 233, 0.12); border-radius: 1px; overflow: hidden;
    }
    #loader .bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #7aa2f7, #f2c078);
      transition: width 0.25s ease;
    }
    #loader .status {
      margin-top: 18px; color: rgba(216, 222, 233, 0.4);
      font-size: 11px; letter-spacing: 0.22em; text-transform: lowercase;
      min-height: 14px;
    }
    #loader .keys {
      position: absolute; bottom: 40px; color: rgba(216, 222, 233, 0.28);
      font-size: 11px; letter-spacing: 0.14em; line-height: 1.9; text-align: center;
    }
    #loader .keys span { color: rgba(242, 192, 120, 0.55); }
    /* ---------- WebGPU-missing message ---------- */
    #nogpu {
      position: fixed; inset: 0; z-index: 200; display: none;
      background: #07080a; color: #d8dee9;
      align-items: center; justify-content: center;
      font-size: 14px; letter-spacing: 0.06em;
    }
    /* ---------- in-game controls hint ---------- */
    #controls-hint {
      position: fixed; left: 0; right: 0; bottom: 18px; z-index: 40;
      text-align: center; pointer-events: none; user-select: none;
      color: rgba(216, 222, 233, 0.30);
      font-size: 11px; letter-spacing: 0.14em; line-height: 1.9;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      opacity: 0; transition: opacity 1.2s ease;
    }
    #controls-hint.visible { opacity: 1; }
    #controls-hint span { color: rgba(242, 192, 120, 0.55); }
    /* ---------- speedometer (dial built by src/ui/speedo.js) ---------- */
    #speedo {
      position: fixed; right: 22px; bottom: 16px; z-index: 40;
      width: 158px; height: 158px;
      pointer-events: none; user-select: none;
      opacity: 0; transition: opacity 1.2s ease;
      line-height: 1;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
    }
    #speedo.visible { opacity: 1; }
    #speedo svg { width: 100%; height: 100%; display: block; }
    #speedo .kmh {
      position: absolute; left: 0; right: 0; top: 96px;
      text-align: center;
      font-size: 26px; font-weight: 300; letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: rgba(216, 222, 233, 0.82);
    }
    /* ---------- Touch controls (mobile only, built by src/ui/touch.js) ---------- */
    #touch-ui { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: none; }
    #touch-ui.on { display: block; }
    .tc {
      position: absolute; pointer-events: auto; user-select: none; -webkit-user-select: none;
      touch-action: none; -webkit-tap-highlight-color: transparent;
    }
    #tc-dpad {
      left: max(16px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom));
      width: 172px; height: 172px; border-radius: 50%;
      background: radial-gradient(circle, rgba(216,222,233,0.03) 30%, rgba(216,222,233,0.09) 100%);
      border: 1px solid rgba(216,222,233,0.20);
    }
    #tc-dpad .bar-v, #tc-dpad .bar-h {
      position: absolute; border-radius: 10px;
      background: rgba(216,222,233,0.07); border: 1px solid rgba(216,222,233,0.14);
    }
    #tc-dpad .bar-v { left: 50%; top: 7%; width: 32%; height: 86%; transform: translateX(-50%); }
    #tc-dpad .bar-h { top: 50%; left: 7%; height: 32%; width: 86%; transform: translateY(-50%); }
    #tc-dpad .nub {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(216,222,233,0.14); border: 1px solid rgba(216,222,233,0.30);
    }
    #tc-dpad.held .nub { background: rgba(242,192,120,0.28); border-color: rgba(242,192,120,0.55); }
    .tc-btn {
      width: 74px; height: 74px; border-radius: 50%;
      background: rgba(216,222,233,0.06); border: 1px solid rgba(216,222,233,0.24);
      color: rgba(216,222,233,0.55); font: 700 19px ui-monospace, Menlo, monospace;
      display: flex; align-items: center; justify-content: center; letter-spacing: 0.08em;
    }
    .tc-btn.held {
      background: rgba(242,192,120,0.22); border-color: rgba(242,192,120,0.60);
      color: rgba(242,192,120,0.95);
    }
    #tc-a { right: max(20px, env(safe-area-inset-right)); bottom: 108px; }
    #tc-b { right: 104px; bottom: max(30px, env(safe-area-inset-bottom)); }
    .tc-btn.small {
      width: 52px; height: 30px; border-radius: 8px; font-size: 9px; letter-spacing: 0.12em;
    }
    #tc-cam  { right: max(20px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); }
    #tc-time { right: 82px; top: max(16px, env(safe-area-inset-top)); }
    #tc-mute { right: 144px; top: max(16px, env(safe-area-inset-top)); }
    /* mobile layout shuffles: hide the keyboard hint, tuck the speedo above B */
    body.touch #controls-hint { display: none; }
    body.touch #speedo {
      right: 8px; bottom: 196px; transform: scale(0.78); transform-origin: bottom right;
    }

    #speedo .unit {
      position: absolute; left: 0; right: 0; top: 126px;
      text-align: center;
      font-size: 9px; letter-spacing: 0.26em;
      color: rgba(242, 192, 120, 0.55);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="loader">
    <div class="mark">NIGHT<b>LOOP</b></div>
    <div class="bar-wrap"><div class="bar" id="loader-bar"></div></div>
    <div class="status" id="loader-status">initialising</div>
    <div class="keys">
      <span>wasd</span> drive &nbsp;·&nbsp; <span>hold rmb</span> glide &nbsp;·&nbsp; <span>space</span> handbrake &nbsp;·&nbsp; <span>1–3</span> time of day &nbsp;·&nbsp; <span>c</span> camera &nbsp;·&nbsp; <span>m</span> mute &nbsp;·&nbsp; <span>0</span> settings
    </div>
  </div>
  <div id="nogpu">This demo requires WebGPU. Use Chrome on desktop.</div>
  <div id="controls-hint">
    <span>wasd</span> drive &nbsp;·&nbsp; <span>hold rmb</span> glide &nbsp;·&nbsp; <span>space</span> handbrake &nbsp;·&nbsp; <span>1–3</span> time of day &nbsp;·&nbsp; <span>c</span> camera &nbsp;·&nbsp; <span>m</span> mute &nbsp;·&nbsp; <span>0</span> settings
  </div>
  <div id="speedo"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
